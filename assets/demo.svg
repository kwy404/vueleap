<text x="640" y="27" text-anchor="middle" fill="#8b949e" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">vueleap demo</text>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#e6edf3">
<text x="24" y="70" xml:space="preserve"><tspan fill="#7ee787">~/shop-front</tspan> <tspan fill="#8b949e">$</tspan> <tspan class="t0" fill-opacity="0">n</tspan><tspan class="t1" fill-opacity="0">p</tspan><tspan class="t2" fill-opacity="0">x</tspan><tspan class="t3" fill-opacity="0"> </tspan><tspan class="t4" fill-opacity="0">v</tspan><tspan class="t5" fill-opacity="0">u</tspan><tspan class="t6" fill-opacity="0">e</tspan><tspan class="t7" fill-opacity="0">l</tspan><tspan class="t8" fill-opacity="0">e</tspan><tspan class="t9" fill-opacity="0">a</tspan><tspan class="t10" fill-opacity="0">p</tspan><tspan id="k" fill="#7ee787">_</tspan></text>
<text class="l r0" x="24" y="91" xml:space="preserve"><tspan fill="#7ee787" font-weight="700">vueleap</tspan> <tspan fill-opacity=".55">v1.0.0</tspan>  <tspan fill-opacity=".55">Vue 2 to Vue 3 migration report</tspan></text>
<text class="l r1" x="24" y="112" xml:space="preserve"></text>
<text class="l r2" x="24" y="133" xml:space="preserve"><tspan fill="#ff7b72" font-weight="700">error</tspan>  <tspan font-weight="700">filters</tspan>  Filters are removed <tspan fill-opacity=".55">(6)</tspan></text>
<text class="l r3" x="24" y="154" xml:space="preserve">       <tspan fill-opacity=".55">https://v3-migration.vuejs.org/breaking-changes/filters</tspan></text>
<text class="l r4" x="24" y="175" xml:space="preserve">       <tspan fill-opacity=".55">compat: COMPILER_FILTERS, FILTERS</tspan></text>
<text class="l r5" x="24" y="196" xml:space="preserve">  <tspan fill="#56d4dd">src/components/ProductList.vue:5:25</tspan>  Filter "capitalize" used in a template expression. Call a method or use a computed property instead.</text>
<text class="l r6" x="24" y="217" xml:space="preserve">  <tspan fill="#56d4dd">src/components/ProductList.vue:5:64</tspan>  Filter "currency" used in a template expression. Call a method or use a computed property instead.</text>
<text class="l r7" x="24" y="238" xml:space="preserve">  <tspan fill="#56d4dd">src/components/ProductList.vue:6:69</tspan>  Filter "capitalize" used in a template expression. Call a method or use a computed property instead.</text>
<text class="l r8" x="24" y="259" xml:space="preserve">  <tspan fill="#56d4dd">src/components/ProductList.vue:30:5</tspan>  Local filter "capitalize" is removed: turn it into a method or a computed property.</text>
<text class="l r9" x="24" y="280" xml:space="preserve">  <tspan fill="#56d4dd">src/legacy/inline.js:7:55          </tspan>  Filter "number" used in a template expression. Call a method or use a computed property instead.</text>
<text class="l r10" x="24" y="301" xml:space="preserve">  <tspan fill="#56d4dd">src/main.js:26:1                   </tspan>  Vue.filter is removed: expose a helper through app.config.globalProperties or import a function.</text>
<text class="l r11" x="24" y="322" xml:space="preserve"></text>
<text class="l r12" x="24" y="343" xml:space="preserve"><tspan fill="#ff7b72" font-weight="700">error</tspan>  <tspan font-weight="700">destroy-hooks</tspan>  beforeDestroy and destroyed are renamed <tspan fill-opacity=".55">(3)</tspan><tspan fill="#7ee787">  [3 fixable]</tspan></text>
<text class="l r13" x="24" y="364" xml:space="preserve">       <tspan fill-opacity=".55">https://v3-migration.vuejs.org/breaking-changes/#other-minor-changes</tspan></text>
<text class="l r14" x="24" y="385" xml:space="preserve">       <tspan fill-opacity=".55">compat: OPTIONS_BEFORE_DESTROY, OPTIONS_DESTROYED</tspan></text>
<text class="l r15" x="24" y="406" xml:space="preserve">  <tspan fill="#56d4dd">src/components/Modal.vue:27:3      </tspan>  destroyed is renamed to unmounted and is ignored by Vue 3.</text>
<text class="l r16" x="24" y="427" xml:space="preserve">  <tspan fill="#56d4dd">src/components/ProductList.vue:50:3</tspan>  beforeDestroy is renamed to beforeUnmount and is ignored by Vue 3.</text>
<text class="l r17" x="24" y="448" xml:space="preserve">  <tspan fill="#56d4dd">src/mixins/tracking.js:5:3         </tspan>  beforeDestroy is renamed to beforeUnmount and is ignored by Vue 3.</text>
<text class="l r18" x="24" y="469" xml:space="preserve"></text>
<text class="l r19" x="24" y="490" xml:space="preserve"><tspan fill="#ff7b72" font-weight="700">error</tspan>  <tspan font-weight="700">keycode-modifiers</tspan>  KeyCode modifiers are removed <tspan fill-opacity=".55">(3)</tspan><tspan fill="#7ee787">  [2 fixable]</tspan></text>
<text class="l r20" x="24" y="511" xml:space="preserve">       <tspan fill-opacity=".55">https://v3-migration.vuejs.org/breaking-changes/keycode-modifiers</tspan></text>
<text class="l r21" x="24" y="532" xml:space="preserve">       <tspan fill-opacity=".55">compat: V_ON_KEYCODE_MODIFIER</tspan></text>
<text class="l r22" x="24" y="553" xml:space="preserve">  <tspan fill="#56d4dd">src/components/TheHeader.vue:5:55</tspan>  KeyCode modifier .13 is removed: use .enter.</text>
<text class="l r23" x="24" y="574" xml:space="preserve">  <tspan fill="#56d4dd">src/components/TheHeader.vue:5:74</tspan>  KeyCode modifier .27 is removed: use .esc.</text>
<text class="l r24" x="24" y="595" xml:space="preserve">  <tspan fill="#56d4dd">src/components/TheHeader.vue:5:99</tspan>  KeyCode modifier .112 is removed: use the kebab-case key name instead.</text>
<text class="l r25" x="24" y="616" xml:space="preserve"></text>
<text class="l r26" x="24" y="637" xml:space="preserve"><tspan font-weight="700">Summary</tspan></text>
<text class="l r27" x="24" y="658" xml:space="preserve">  Files scanned     21</text>
<text class="l r28" x="24" y="679" xml:space="preserve">  Files affected    19</text>
<text class="l r29" x="24" y="700" xml:space="preserve">  Findings          75  (<tspan fill="#ff7b72">55 errors</tspan>, <tspan fill="#e3b341">17 warnings</tspan>, <tspan fill="#79c0ff">3 info</tspan>)</text>
<text class="l r30" x="24" y="721" xml:space="preserve">  Auto fixable      18<tspan fill-opacity=".55">  (preview with --fix, apply with --fix --write)</tspan></text>
<text class="l r31" x="24" y="742" xml:space="preserve">  Effort score      59  <tspan fill-opacity=".55">(large)</tspan></text>
</g>
